# The `migration-replay` check: replays every migration in supabase/migrations,
# in order, on an empty Supabase Postgres at production's version
# (supabase/postgres-image), and fails on any error. Runs on every PR into main,
# not only PRs touching supabase/, so that a ruleset can require it without
# blocking PRs it would otherwise skip. It touches no Supabase project and uses
# no secrets.
name: migration-replay

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    name: migration-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Migration numbers (scripts/check-migration-order.mjs)
        run: node scripts/check-migration-order.mjs "origin/${{ github.base_ref || 'main' }}"

      - name: Replay every migration (scripts/replay-migrations.sh)
        run: bash scripts/replay-migrations.sh

      # Every app embed must still resolve through PostgREST on the replayed
      # schema: a second FK between two tables makes an un-hinted embed
      # ambiguous (PGRST201), which the SQL replay can't see. Zero embeds is a
      # pass once the scan has read a source file under src/; no src/ is a fail.
      - name: App embeds resolve through PostgREST (scripts/check-embeds-local.sh)
        run: bash scripts/check-embeds-local.sh
